services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: buscaai
      POSTGRES_PASSWORD: buscaai
      POSTGRES_DB: buscaai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buscaai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://buscaai:buscaai@db:5432/buscaai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
